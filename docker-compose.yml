services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile   # production build (pnpm build + node server)
    container_name: innova-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_BASE: http://localhost:8080/api/v1
      SERVER_API_BASE: http://host.docker.internal:8080/api/v1
      BACKEND_URL: http://host.docker.internal:8080
    restart: unless-stopped

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev   # hot-reload dev server
    container_name: innova-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app                     # monta el código fuente para hot-reload
      - /app/node_modules          # excluye node_modules del bind mount
    environment:
      API_BASE: http://localhost:8080/api/v1
      SERVER_API_BASE: http://host.docker.internal:8080/api/v1
      BACKEND_URL: http://host.docker.internal:8080
    profiles:
      - dev
